name: CI

on:
  pull_request:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Cheap, OS-independent checks run once.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run schema:check
      - name: Pre-registration (frozen hashes)
        run: node scripts/eval/verify-prereg.ts
      # The release rehearsal, on every pull request so that the release pipeline cannot rot: the same release-check that
      # release.yml runs (on the channel the package.json version names), then npm's own dry run of a publish. Nothing is
      # sent anywhere; the real publish is release.yml, started by hand.
      - run: npm run build
      - name: Release dry run (release-check, then npm publish --dry-run)
        run: |
          node scripts/release-check.ts --channel auto
          tag=$(node scripts/release-check.ts --channel auto --print-tag)
          npm publish --dry-run --ignore-scripts --tag "$tag"

  # Node 24.16.0 is the floor (24.15.0 truncates TEXT at NUL in node:sqlite); 26 is the next LTS.
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows is postponed past the initial alpha (Decision 2026-10-18, Decision 2) and is not run here; windows-latest is
    # re-added to the matrix when .planning/todos/pending/windows-support-post-alpha.md is done.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24.16.0", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # scripts/corpus-survey/survey.test.ts shells out to ripgrep, which neither hosted image ships.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ripgrep; else sudo apt-get install -y ripgrep; fi
          rg --version
      - name: Print toolchain versions
        run: |
          node --version
          npm --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run grammar:budget

  # The only job that fetches the wasi-sdk toolchain: rebuild grammars on every OS and compare hashes (D-07).
  grammar:
    name: Grammar rebuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows is postponed past the initial alpha (Decision 2026-10-18, Decision 2) and is not run here; windows-latest is
    # re-added to the matrix when .planning/todos/pending/windows-support-post-alpha.md is done.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tree-sitter
            ~\AppData\Local\tree-sitter
          key: ${{ runner.os }}-wasi34-binaryen132
      - run: node scripts/ensure-tree-sitter.ts
      # One JSON line per module with this OS's rebuild sha256. grammar:verify below is what judges it; a platform with no
      # grammar.lock entry fails there, and its entry is then recorded from this printed value (grammar-build --update-platform).
      - name: Report rebuild hashes
        run: node scripts/grammar-build.ts --report
      - run: npm run grammar:verify

  # The measured gates of the pinned corpus (ROADMAP success criteria 1, 2 and 4) on every OS: recall, the corpus build
  # checks, the 20,000-edit size gate and save-to-find freshness. All but the last are counts, sizes and ratios. The
  # freshness bound is the approved pull request ceiling (hosted runners are noisy); the strict one-second p99 is nightly.yml.
  gates:
    name: Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows is postponed past the initial alpha (Decision 2026-10-18, Decision 2) and is not run here; windows-latest is
    # re-added to the matrix when .planning/todos/pending/windows-support-post-alpha.md is done.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Recall on the pinned corpus
        run: node scripts/recall.ts --corpus gsd-core
      - name: Corpus build gates
        run: node scripts/corpus-gates.ts
      - name: Size gate (20,000 edits)
        run: node scripts/size-gate.ts
      - name: Freshness gate (pull request ceiling)
        run: node scripts/freshness-gate.ts --saves 30 --max-ms 3000
      # The precise tier budgets (plan 03-30, ROADMAP criterion 2) at the approved pull request ceilings: the pinned corpus is
      # fetched, nothing is installed (the bundled compiler), and the median of 5 one-file updates and the p95 of 10 warm
      # queries are judged, so one slow sample on a hosted runner does not fail a pull request. The roadmap figures run
      # nightly (nightly.yml). The ceilings are constants of the script, not flags.
      - name: Precise tier gate (pull request ceilings)
        run: node scripts/precise-gate.ts --pr --corpus gsd-core
