name: CI

on:
  pull_request:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Cheap, OS-independent checks run once.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run schema:check
      - name: Pre-registration (frozen hashes)
        run: node scripts/eval/verify-prereg.ts

  # Node 24.16.0 is the floor (24.15.0 truncates TEXT at NUL in node:sqlite); 26 is the next LTS.
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24.16.0", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Hosted Windows only (.planning/debug/windows-ci-diag.md): the default temp folder is on the C: virtual disk, where
      # fsync-bearing file operations take 3 to 6 ms, 13 to 14 times the Linux figure; the runner temp folder is on D:, which
      # is within 1.2 to 1.7 times Linux. This suite creates and syncs thousands of files in the temp folder, so every later
      # step of the job is pointed at the runner temp folder. (Defender real-time scanning is already off on the image and
      # git launcher layers cost nothing measurable, so neither is touched.)
      - name: Use the fast runner disk for temporary files (Windows only)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Print toolchain versions
        run: |
          node --version
          npm --version
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run grammar:budget

  # The only job that fetches the wasi-sdk toolchain: rebuild grammars on every OS and compare hashes (D-07).
  grammar:
    name: Grammar rebuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      # Hosted Windows only (.planning/debug/windows-ci-diag.md): the default temp folder is on the C: virtual disk, where
      # fsync-bearing file operations take 3 to 6 ms, 13 to 14 times the Linux figure; the runner temp folder is on D:, which
      # is within 1.2 to 1.7 times Linux. This suite creates and syncs thousands of files in the temp folder, so every later
      # step of the job is pointed at the runner temp folder. (Defender real-time scanning is already off on the image and
      # git launcher layers cost nothing measurable, so neither is touched.)
      - name: Use the fast runner disk for temporary files (Windows only)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tree-sitter
            ~\AppData\Local\tree-sitter
          key: ${{ runner.os }}-wasi34-binaryen132
      - run: node scripts/ensure-tree-sitter.ts
      # One JSON line per module with this OS's rebuild sha256. grammar:verify below is what judges it; a platform with no
      # grammar.lock entry fails there, and its entry is then recorded from this printed value (grammar-build --update-platform).
      - name: Report rebuild hashes
        run: node scripts/grammar-build.ts --report
      - run: npm run grammar:verify

  # The measured gates of the pinned corpus (ROADMAP success criteria 1, 2 and 4) on every OS: recall, the corpus build
  # checks, the 20,000-edit size gate and save-to-find freshness. All but the last are counts, sizes and ratios. The
  # freshness bound is the approved pull request ceiling (hosted runners are noisy); the strict one-second p99 is nightly.yml.
  gates:
    name: Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      # Hosted Windows only (.planning/debug/windows-ci-diag.md): the default temp folder is on the C: virtual disk, where
      # fsync-bearing file operations take 3 to 6 ms, 13 to 14 times the Linux figure; the runner temp folder is on D:, which
      # is within 1.2 to 1.7 times Linux. This suite creates and syncs thousands of files in the temp folder, so every later
      # step of the job is pointed at the runner temp folder. (Defender real-time scanning is already off on the image and
      # git launcher layers cost nothing measurable, so neither is touched.)
      - name: Use the fast runner disk for temporary files (Windows only)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Recall on the pinned corpus
        run: node scripts/recall.ts --corpus gsd-core
      - name: Corpus build gates
        run: node scripts/corpus-gates.ts
      - name: Size gate (20,000 edits)
        run: node scripts/size-gate.ts
      - name: Freshness gate (pull request ceiling)
        run: node scripts/freshness-gate.ts --saves 30 --max-ms 3000
      # Diagnostic only (plan 02-46, .planning/debug/windows-freshness.md). The three steps below run on the hosted Windows
      # job alone, after every normal gate, and cannot fail the job: they run the freshness gate once more with the opt-in
      # spawn trace (the gate's own bound, unchanged) so the next hosted Windows run shows the per-spawn cost, the event
      # delay and the commit time as numbers, in the log and as an artifact. No normal step loads the trace.
      - name: Freshness trace (Windows diagnostic)
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          GSD_ATLAS_TRACE_FILE: ${{ runner.temp }}/freshness-trace.log
        run: node --import ./scripts/diagnostics/trace-spawns.mjs scripts/freshness-gate.ts --saves 30 --max-ms 3000
      - name: Freshness trace summary
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        env:
          GSD_ATLAS_TRACE_FILE: ${{ runner.temp }}/freshness-trace.log
        run: node scripts/diagnostics/trace-summary.ts "$GSD_ATLAS_TRACE_FILE"
      - name: Freshness trace artifact
        if: always() && matrix.os == 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freshness-trace-windows
          path: ${{ runner.temp }}/freshness-trace.log
          if-no-files-found: ignore
