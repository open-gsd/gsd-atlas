# THROWAWAY. Plan 01-16 deletes this workflow once cross-OS parity is recorded.
#
# Purpose: record, per OS, the hash of the toy grammar WASM rebuilt from source and compare it
# with that OS's own entry in test/fixtures/modules/toy/grammar.lock (wasm.platforms). The first
# CI run found win32 does not reproduce the Linux/macOS bytes (assumption A1 refuted for win32),
# so the lock holds one hash per platform key and each job fails if its rebuild does not equal
# its own entry. A platform with no entry fails too (matchesLock is false). The committed wasm
# stays pinned to wasm.sha256 by the same check.
name: grammar-hash-parity

on:
  workflow_dispatch:
  push:
    branches: ['ci/**']

permissions:
  contents: read

concurrency:
  group: grammar-hash-parity-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  parity:
    name: parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16.0

      - run: npm ci --ignore-scripts

      # wasi-sdk and binaryen are downloaded by the tree-sitter CLI into its cache directory.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/tree-sitter
            ~/Library/Caches/tree-sitter
            ~/AppData/Local/tree-sitter
          key: ${{ runner.os }}-wasi34-binaryen132

      # The single explicit fetch of the CLI binary (npm ci --ignore-scripts leaves none).
      - run: node scripts/ensure-tree-sitter.ts

      # --report prints one JSON line and writes nothing into the module. The JSON carries this
      # platform's lock entry and whether the rebuild equals it.
      - name: Rebuild and record hash
        run: node scripts/grammar-build.ts --report test/fixtures/modules/toy | tee parity-report.json

      - name: Compare with this OS's own grammar.lock entry
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("parity-report.json", "utf8").trim());
            console.log(`${report.platformKey}: rebuild ${report.sha256} (${report.bytes} bytes), lock entry ${report.lockSha256}, committed wasm hash ${report.committedSha256}`);
            if (report.platformKey === null || report.lockSha256 === null) {
              console.error(`grammar.lock has no wasm.platforms entry for ${report.platform}-${report.arch}`);
              process.exit(1);
            }
            if (!report.matchesLock) {
              console.error(`rebuild hash ${report.sha256} differs from grammar.lock wasm.platforms.${report.platformKey} (${report.lockSha256})`);
              process.exit(1);
            }
          '
