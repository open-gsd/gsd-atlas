name: diag-nobreak-p3

# Throwaway (plan 03-30 Task 3, second round: limit a sixth up, big package three times larger): prints the calibration and the bounded run of the no-break fixture test on hosted Linux and
# Windows, three times each. Removed from the branch once the evidence is recorded.
on:
  push:
    branches: ["ci/phase3-precise"]
    paths: [".github/workflows/diag-nobreak-p3.yml"]

permissions:
  contents: read

jobs:
  nobreak:
    name: nobreak (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["24.16.0", "26"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use the fast runner disk for temporary files (Windows only)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Three runs
        run: |
          for i in 1 2 3; do
            echo "=== run $i"
            node --test scripts/diag-nobreak.test.ts 2>&1 | grep -E "DIAG|✖|✔ (too-large|the eager|nobreak on)|AssertionError" | cut -c1-2500 || true
          done
