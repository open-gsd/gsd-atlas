name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The strict figures that a hosted pull request runner is too noisy to judge: the ROADMAP's one second p99 for save to
  # find (100 saves, so p99 is the 99th value, not just the largest), and the corpus build with its timings printed.
  strict:
    name: Strict gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows is postponed past the initial alpha (Decision 2026-10-18, Decision 2) and is not run here; windows-latest is
    # re-added to the matrix when .planning/todos/pending/windows-support-post-alpha.md is done.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Freshness gate (strict p99)
        run: node scripts/freshness-gate.ts --saves 100 --max-ms 1000
      - name: Corpus build gates (timings printed)
        run: node scripts/corpus-gates.ts
      # The precise tier at the roadmap figures (plan 03-30, ROADMAP criterion 2): a full gsd-core build including the
      # compiler pass in 60 s (raised from 30 s on 2026-10-18 after hosted-Linux
      # measurements; see 03-30-SUMMARY.md), the p95 of 20 one-file updates in 5 s, the p95 of 50 warm queries in 2 s. The pinned corpus
      # is fetched and nothing is installed, so the compiler is the bundled one; the JSON line prints its version.
      - name: Precise tier gate (strict)
        run: node scripts/precise-gate.ts --strict --corpus gsd-core
      # The pinned gsd-pi checkout (a multi-package repository): 12 symbols, none may crash the Host, push a worker past its
      # memory limit or come back unexplained (D-21, D-22). Resolved cross-package edges are not a criterion.
      - name: gsd-pi no-break trace
        run: node scripts/precise-gate.ts --nobreak --corpus gsd-pi
