name: diag-p3

# Throwaway (plan 03-30 Task 3): runs each test file alone on hosted Windows with a time limit, to find which file hangs and
# why the others fail. Removed from the branch once the evidence is recorded.
on:
  push:
    branches: ["ci/phase3-precise"]

permissions:
  contents: read

concurrency:
  group: diag-p3
  cancel-in-progress: true

jobs:
  # The same steps as the strict job of nightly.yml (the hook of this environment refuses `gh workflow run`), run once on the
  # branch so the strict figures exist on the three operating systems.
  strict:
    name: Strict gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - name: Use the fast runner disk for temporary files (Windows only)
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Freshness gate (strict p99)
        run: node scripts/freshness-gate.ts --saves 100 --max-ms 1000
      - name: Corpus build gates (timings printed)
        if: ${{ !cancelled() }}
        run: node scripts/corpus-gates.ts
      - name: Precise tier gate (strict)
        if: ${{ !cancelled() }}
        run: node scripts/precise-gate.ts --strict --corpus gsd-core
      - name: gsd-pi no-break trace
        if: ${{ !cancelled() }}
        run: node scripts/precise-gate.ts --nobreak --corpus gsd-pi

  windows-per-file:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - name: Use the fast runner disk for temporary files
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Each test file alone, 420 s each
        run: |
          : > "$RUNNER_TEMP/summary.txt"
          for f in $(git ls-files | grep -E '^(src|scripts)/.*\.test\.ts$'); do
            start=$(date +%s)
            timeout 420 node --test "$f" > "$RUNNER_TEMP/one.log" 2>&1
            code=$?
            secs=$(( $(date +%s) - start ))
            echo "RESULT exit=$code secs=$secs $f" | tee -a "$RUNNER_TEMP/summary.txt"
            if [ "$code" -ne 0 ]; then
              echo "::group::FAILED $f (exit $code)"
              grep -n -B2 -A25 "failing tests\|^# Subtest.*\bnot ok\|✖" "$RUNNER_TEMP/one.log" | head -150
              echo "---- tail"
              tail -n 40 "$RUNNER_TEMP/one.log"
              echo "::endgroup::"
            fi
          done
          echo "=== non-zero files"
          grep -v "exit=0 " "$RUNNER_TEMP/summary.txt" || true
